submission:
  title: "GridGuard AI"

  problem_statement: >
    Power utilities face difficulty predicting transformer and substation
    failures before they cause power outages. Unexpected equipment failures,
    changing weather conditions, and limited maintenance resources can lead
    to service disruptions and delayed response.

  solution_summary: >
    GridGuard AI is an AI-powered Power Outage Prediction and Grid Equipment
    Failure Advisor that analyzes sensor data, historical failures, weather
    conditions, and asset information to identify high-risk grid equipment.
    It provides risk scores, priority levels, maintenance recommendations,
    and crew pre-positioning suggestions through a real-time dashboard and map.

  key_features:
    - "Equipment failure risk prediction"
    - "Grid impact and priority scoring for critical assets"
    - "Weather risk analysis for outage-prone conditions"
    - "Maintenance and crew pre-positioning recommendations"
    - "Real-time dashboard and map for identifying high-risk assets"

  tech_stack:
    languages: ["Python", "HTML", "CSS", "JavaScript"]
    frameworks: ["Flask"]
    ibm_technologies: ["IBM watsonx.ai"]
    databases: [""]
    other: ["GitHub"]

  what_we_are_most_proud_of: >
    We are most proud of combining multiple risk factors such as equipment
    condition, historical failures, weather conditions, and grid impact into
    a single priority-driven system. Instead of only predicting failures,
    GridGuard AI converts predictions into actionable maintenance and crew
    deployment recommendations.

  known_limitations: >
    The current prototype uses available or simulated data and is not yet
    connected to live utility sensor systems. Prediction accuracy may improve
    further with larger real-world datasets, continuous sensor streams, and
    deployment in an actual utility environment.

